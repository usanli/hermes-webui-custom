services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    command: gateway run
    volumes:
      - hermes-home:/home/hermes/.hermes
      - hermes-agent-src:/opt/hermes
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=1000
      - HERMES_GID=1000
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY}
    restart: unless-stopped
    mem_limit: 768m

  hermes-webui:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - hermes-agent
    volumes:
      - hermes-home:/home/hermeswebui/.hermes
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro
      - hermes-workspace:/workspace
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD}
      - HERMES_API_URL=http://hermes-agent:8642
      - HERMES_WEBUI_GATEWAY_API_KEY=${API_SERVER_KEY}
      - GH_TOKEN=${GH_TOKEN}
      - WANTED_UID=1000
      - WANTED_GID=1000
    restart: unless-stopped
    mem_limit: 2g

volumes:
  hermes-home:
  hermes-agent-src:
  hermes-workspace:
